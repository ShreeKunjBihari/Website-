    <!-- Product Details -->
    <main class="product-detail">
        <div class="container">

            <div class="product-detail-header">
                <h1 id="productTitle">Loading product...</h1>

                <p id="productDescription"></p>
            </div>

            <!-- Impurity count is generated by JavaScript -->

            <!-- Impurity images and names are generated here -->

            <div style="text-align: center; margin-top: 35px;">

                   style="color: #1556a8; text-decoration: none;">
                    &larr; Back to Product Catalog
                </a>
            </div>

        </div>
    </main>

    <!-- PRODUCT DETAIL QUOTE MODAL -->
<div
    class="quote-modal"
    id="detailQuoteModal"
    aria-hidden="true">

    <div
        class="quote-modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detailQuoteTitle">

        <button
            class="quote-close"
            id="detailQuoteClose"
            type="button"
            aria-label="Close form">
            &times;
        </button>

        <h2 id="detailQuoteTitle">Request a Quote</h2>
        <p>Tell us your requirements for this compound.</p>

        <form id="detailQuoteForm">
            <div class="quote-form-grid">

                <label>
                    Full Name *
                    <input name="name" type="text"
                           autocomplete="name" required>
                </label>

                <label>
                    Company Name
                    <input name="company" type="text"
                           autocomplete="organization">
                </label>

                <label>
                    Business Email *
                    <input name="email" type="email"
                           autocomplete="email" required>
                </label>

                <label>
                    Phone Number
                    <input name="phone" type="tel"
                           autocomplete="tel">
                </label>

                <label>
                    Parent Product
                    <input name="product" id="detailQuoteProduct"
                           type="text" readonly>
                </label>

                <label>
                    Compound / Impurity
                    <input name="compound" id="detailQuoteCompound"
                           type="text" readonly>
                </label>

                <label>
                    CAS Number
                    <input name="cas" id="detailQuoteCas"
                           type="text" placeholder="If available">
                </label>

                <label>
                    Quantity Required
                    <input name="quantity" type="text"
                           placeholder="e.g. 100 mg">
                </label>

                <label class="quote-full-width">
                    Requirements *
                    <textarea name="message" rows="4"
                              placeholder="Tell us about your requirements..."
                              required></textarea>
                </label>

            </div>

            <button class="quote-submit" type="submit">
                Submit Enquiry
            </button>

            <p class="quote-form-status"
               id="detailQuoteStatus"
               role="status"
               aria-live="polite"></p>
        </form>
    </div>
</div>

   <!-- IMAGE ZOOM VIEWER -->

        id="imageZoomClose"
        type="button"
        aria-label="Close enlarged image">
        &times;
    </button>

    <img id="imageZoomPreview" src="" alt="">
</div>
